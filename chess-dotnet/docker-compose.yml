version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chessdb
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chessdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./ChessApi
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=chessdb;Username=chess;Password=${POSTGRES_PASSWORD:-changeme}
      AppConfig__OpenAiApiKey: ${OPENAI_API_KEY}
      AppConfig__DefaultModel: ${DEFAULT_MODEL:-gpt-4o-mini}
      AppConfig__MaxRetries: "3"
      AppConfig__Temperature: "0.3"
      AppConfig__MoveHistoryLimit: "5"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # No ports exposed to host — only reachable via nginx proxy

  frontend:
    build:
      context: ./ChessBlazor
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
