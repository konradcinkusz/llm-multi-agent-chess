name: deploy-pages

# Checks that the one-page site (docs/index.html) still assembles. It deploys nothing.
#
# Since ADR-013 the public results site is the static export that the app publishes to the gh-pages branch
# (README: "Public results site"). The one-pager moves into that export as about/, so this job only proves the
# page and its assets still collect into a folder that holds nothing but the page.
#
# docs/ holds the standards as markdown as well as the page, and serving those raw would put unrendered .md files
# on a public URL. So the job collects a _site/ that contains only the page and its assets rather than copying docs/.

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: Assemble the one-pager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Collect the page and its assets
        run: |
          mkdir -p _site/assets
          cp docs/index.html _site/
          # The logo is optional (generate-github-page §5): with no docs/assets/*.svg the glob matches nothing
          # and a bare cp fails the job. This repo has no logo.
          if compgen -G 'docs/assets/*.svg' > /dev/null; then
            cp docs/assets/*.svg _site/assets/
          fi

      - name: Check that the page assembled
        run: |
          test -s _site/index.html
          grep -q '<html' _site/index.html
          find _site -type f | sort
