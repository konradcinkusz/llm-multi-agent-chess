name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Build (warnings as errors)
        run: dotnet build Chess.sln -warnaserror

      # The browser journeys (Chess.E2E) need a Chromium, so they run only in the e2e job, which installs one first.
      - name: Test
        run: dotnet test Chess.sln --no-build --filter "FullyQualifiedName!~Chess.E2E" --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
      GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      # --log-opts=HEAD limits the scan to commits reachable from the checked-out revision.
      # Without it gitleaks runs `git log --all`, and fetch-depth 0 brings in every branch,
      # so an unmerged branch (e.g. a deliberate canary) turns every other PR red.
      - name: Scan every commit reachable from HEAD
        run: gitleaks detect --source . --config .gitleaks.toml --log-opts="HEAD" --redact --no-banner --verbose

  kernel-size:
    name: kernel size guard (ServiceDefaults <= 400 lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Count lines of .cs in Chess.ServiceDefaults
        run: |
          lines=$(find src/Chess.ServiceDefaults -name '*.cs' -not -path '*/obj/*' -not -path '*/bin/*' -print0 | xargs -0 cat | wc -l)
          echo "Chess.ServiceDefaults: ${lines} lines of .cs (limit 400)"
          if [ "${lines}" -gt 400 ]; then
            echo "::error::Chess.ServiceDefaults has ${lines} lines of .cs; the limit is 400 (03 §2, T1.1)"
            exit 1
          fi

  contracts:
    name: Copilot SDK only in Chess.Llm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Find GitHub.Copilot.SDK references outside Chess.Llm
        run: |
          offenders=$(grep -rl --include='*.csproj' 'GitHub\.Copilot\.SDK' src tests | grep -v '^src/Chess\.Llm/Chess\.Llm\.csproj$' || true)
          if [ -n "${offenders}" ]; then
            echo "::error::GitHub.Copilot.SDK may only be referenced by src/Chess.Llm/Chess.Llm.csproj (03 §3.1, invariant)"
            echo "${offenders}"
            exit 1
          fi
          echo "GitHub.Copilot.SDK is referenced only by Chess.Llm"

      # A project that gets the SDK types transitively (Chess.Api through ProjectReference) compiles a `using` with no
      # csproj change, so the code itself is checked too.
      - name: Find Copilot SDK namespaces in code outside Chess.Llm
        run: |
          offenders=$(grep -rnE --include='*.cs' 'using GitHub\.Copilot|GitHub\.Copilot\.' src tests | grep -v '/obj/' | grep -v '/bin/' | grep -v -e '^src/Chess\.Llm/' -e '^tests/Chess\.Llm\.Tests/' || true)
          if [ -n "${offenders}" ]; then
            echo "::error::GitHub.Copilot types may only be used inside src/Chess.Llm and tests/Chess.Llm.Tests (03 §3.1, invariant)"
            echo "${offenders}"
            exit 1
          fi
          echo "No GitHub.Copilot namespace is used outside Chess.Llm"

  solution:
    name: every project is in Chess.sln and every web project is in the AppHost
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check solution membership and AppHost registration
        run: |
          dotnet sln Chess.sln list | tr '\\' '/' | sed '1,2d' | sort > solution-projects.txt
          status=0

          for project in $(find src tests -name '*.csproj' -not -path '*/obj/*' -not -path '*/bin/*' | sort); do
            if ! grep -qxF "${project}" solution-projects.txt; then
              echo "::error file=${project}::not in Chess.sln (04 §3 rule 9)"
              status=1
            fi
          done

          for project in $(grep -l 'Sdk="Microsoft.NET.Sdk.Web"' $(find src -name '*.csproj') || true); do
            name=$(basename "${project}" .csproj)
            resource=$(echo "${name}" | tr '.-' '__')
            if ! grep -qE "Projects\.${resource}([^A-Za-z0-9_]|$)" src/Chess.AppHost/AppHost.cs; then
              echo "::error file=${project}::web project ${name} is not registered in src/Chess.AppHost/AppHost.cs (04 §3 rule 9)"
              status=1
            fi
          done

          exit "${status}"

  e2e:
    name: end-to-end journeys (Playwright, AppHost with the fake gateway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Build the E2E project (warnings as errors)
        run: dotnet build tests/Chess.E2E -warnaserror

      - name: Install Playwright Chromium with its system dependencies
        run: pwsh tests/Chess.E2E/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run the journeys
        run: dotnet test tests/Chess.E2E --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
